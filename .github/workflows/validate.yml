name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skills, README, plugin files and prices in sync
        run: python tools/validate.py
      - name: Run every script against the fake Apify client (no token, no network)
        run: python -m unittest discover tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Agent Skills discovery
        env:
          DISABLE_TELEMETRY: "1"
        run: npx --yes skills@1.7.0 add . --list
      - name: Claude Code plugin and marketplace
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.284
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/plugin.json
